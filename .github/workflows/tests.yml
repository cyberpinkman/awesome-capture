name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hashed CI dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-ci.lock

      - name: Install required POSIX media tools
        timeout-minutes: 13
        run: |
          for attempt in 1 2; do
            echo "Installing ffmpeg (attempt ${attempt}/2)"
            if sudo timeout --kill-after=10s 45s \
              apt-get \
                -o Acquire::Retries=1 \
                -o Acquire::http::Timeout=15 \
                -o Acquire::https::Timeout=15 \
                update &&
              sudo timeout --kill-after=10s 300s \
              apt-get \
                -o Acquire::Retries=1 \
                -o Acquire::http::Timeout=15 \
                -o Acquire::https::Timeout=15 \
                -o Dpkg::Lock::Timeout=30 \
                install --yes --no-install-recommends ffmpeg; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              sudo timeout --kill-after=5s 30s dpkg --configure -a || true
            fi
          done
          exit 1

      - name: Verify required POSIX media tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Verify generated contracts
        run: python tools/sync_vendored.py --check

      - name: Verify release metadata
        run: python tools/release.py check

      - name: Validate smoke scope and checked-in receipts
        run: |
          python tools/smoke_receipts.py validate-scope
          python tools/smoke_receipts.py validate-existing

      - name: Run offline tests with no skips
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -m coverage run --branch tools/run_tests.py \
            --fail-on-skip --github-annotations
          python -m coverage report --show-missing
          python -m coverage xml -o "$RUNNER_TEMP/coverage.xml"

      - name: Verify repository hygiene
        run: |
          python tools/check_repository_hygiene.py
          git diff --check
          test -z "$(git status --porcelain)"

  macos-posix:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hashed CI dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-ci.lock

      - name: Install required POSIX media tools
        timeout-minutes: 15
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ffmpeg

      - name: Verify required POSIX media tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Verify generated contracts
        run: python tools/sync_vendored.py --check

      - name: Verify release metadata
        run: python tools/release.py check

      - name: Validate smoke scope and checked-in receipts
        run: |
          python tools/smoke_receipts.py validate-scope
          python tools/smoke_receipts.py validate-existing

      - name: Run offline tests with no skips
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m coverage run --branch tools/run_tests.py \
            --fail-on-skip --github-annotations
          python -m coverage report --show-missing
          python -m coverage xml -o "$RUNNER_TEMP/coverage.xml"

      - name: Verify repository hygiene
        run: |
          python tools/check_repository_hygiene.py
          git diff --check
          test -z "$(git status --porcelain)"

  required:
    if: ${{ always() }}
    needs:
      - linux
      - macos-posix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the complete no-skip matrix
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos-posix.result }}
        run: |
          set -euo pipefail
          if [ "$LINUX_RESULT" != "success" ] || [ "$MACOS_RESULT" != "success" ]; then
            echo "::error title=Required CI failed::Every Linux and macOS matrix job must succeed."
            exit 1
          fi
