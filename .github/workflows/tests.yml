name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hashed CI dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-ci.lock

      - name: Verify required POSIX media tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Verify generated contracts
        run: python tools/sync_vendored.py --check

      - name: Validate any checked-in smoke receipts
        run: python tools/smoke_receipts.py validate-existing

      - name: Run offline tests with no skips
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -m coverage run --branch tools/run_tests.py --fail-on-skip
          python -m coverage report --show-missing
          python -m coverage xml -o "$RUNNER_TEMP/coverage.xml"

      - name: Verify repository hygiene
        run: |
          python tools/check_repository_hygiene.py
          git diff --check
          test -z "$(git status --porcelain)"

  macos-posix:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hashed CI dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --only-binary=:all:
          --require-hashes
          -r requirements-ci.lock

      - name: Verify required POSIX media tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Verify generated contracts
        run: python tools/sync_vendored.py --check

      - name: Validate any checked-in smoke receipts
        run: python tools/smoke_receipts.py validate-existing

      - name: Run offline tests with no skips
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m coverage run --branch tools/run_tests.py --fail-on-skip
          python -m coverage report --show-missing
          python -m coverage xml -o "$RUNNER_TEMP/coverage.xml"

      - name: Verify repository hygiene
        run: |
          python tools/check_repository_hygiene.py
          git diff --check
          test -z "$(git status --porcelain)"
